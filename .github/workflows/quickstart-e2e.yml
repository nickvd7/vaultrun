name: Quickstart E2E

# Runs the README quickstart exactly as a new user would:
# cp .env.example .env -> make up -> make bootstrap-key -> create session -> run command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^MASTER_API_KEY=.*/MASTER_API_KEY=$(openssl rand -hex 32)/" .env
          echo "VAULTRUN_SECRET_E2E_TOKEN=e2e-secret-value" >> .env

      - name: make up
        run: |
          make up
          grep -Eq '^AUDIT_HMAC_KEY=.{64}$' .env || { echo "make up did not generate AUDIT_HMAC_KEY" >&2; exit 1; }
          grep -Eq '^POSTGRES_PASSWORD=.{64}$' .env || { echo "make up did not replace the example POSTGRES_PASSWORD" >&2; exit 1; }
          grep -Eq '^REDIS_PASSWORD=.{64}$' .env || { echo "make up did not generate REDIS_PASSWORD" >&2; exit 1; }

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "API healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: make bootstrap-key
        run: |
          KEY=$(make -s bootstrap-key | jq -er '.key')
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: /metrics requires authentication
        run: |
          MASTER=$(grep '^MASTER_API_KEY=' .env | cut -d= -f2-)
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = "401" ] || { echo "/metrics is open" >&2; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $MASTER" http://localhost:8080/metrics)" = "200" ] || { echo "/metrics rejects the master key" >&2; exit 1; }

      - name: Create session
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"image":"python:3.12-slim"}')
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "201" ] || { echo "session creation failed" >&2; exit 1; }
          echo "SESSION_ID=$(echo "$BODY" | jq -er '.id')" >> "$GITHUB_ENV"

      - name: Run a command in the sandbox
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"python","args":["-c","print(\"hello from sandbox\")"]}')
          echo "$RESP"
          [ "$(echo "$RESP" | jq -r '.exit_code')" = "0" ]
          echo "$RESP" | jq -er '.stdout' | grep -q "hello from sandbox"

      - name: Sandbox writes to its workspace; directories are private; bad input is reported
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"sh","args":["-c","mkdir -p out && echo ok > out/f.txt && cat out/f.txt"]}')
          [ "$(echo "$RESP" | jq -r '.exit_code')" = "0" ] || { echo "$RESP" >&2; exit 1; }
          MODE=$(sudo stat -c %a "$(grep '^WORKSPACE_HOST_DIR=' .env | cut -d= -f2-)/$SESSION_ID")
          [ "$MODE" = "700" ] || { echo "session directory mode is $MODE, want 700" >&2; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/files" \
            -H "X-API-Key: $API_KEY" -F 'file=x;filename=a.txt' -F 'path=../escape.txt')
          [ "$CODE" = "400" ] || { echo "upload with .. got $CODE, want 400" >&2; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -d '{"name":"bad name!!"}')
          [ "$CODE" = "400" ] || { echo "invalid session name got $CODE, want 400" >&2; exit 1; }

      - name: Secrets broker injects VAULTRUN_SECRET_* from .env
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"sh","args":["-c","printf %s \"$E2E_TOKEN\" | wc -c"],"secrets":["E2E_TOKEN"]}')
          echo "$RESP" | jq -r '.exit_code, .stderr'
          [ "$(echo "$RESP" | jq -r '.exit_code')" = "0" ]
          [ "$(echo "$RESP" | jq -r '.stdout' | tr -d '[:space:]')" = "16" ]

      - name: Injected secrets are redacted from output
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"sh","args":["-c","echo token=$E2E_TOKEN"],"secrets":["E2E_TOKEN"]}')
          echo "$RESP" | jq -r '.stdout'
          [ "$(echo "$RESP" | jq -r '.stdout')" = "token=[REDACTED:E2E_TOKEN]" ]
          RUN_ID=$(echo "$RESP" | jq -r '.id')
          STORED=$(curl -sS "http://localhost:8080/api/v1/runs/$RUN_ID" -H "X-API-Key: $API_KEY" | jq -r '.stdout')
          if echo "$STORED" | grep -q "e2e-secret-value"; then
            echo "secret value found in stored output" >&2; exit 1
          fi

      - name: Invalid session requests return 400
        run: |
          expect400() {
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -d "$1")
            echo "$1 -> HTTP $CODE"
            [ "$CODE" = "400" ]
          }
          expect400 '{"cpu_limit":-1}'
          expect400 '{"memory_limit_mb":-1}'
          expect400 '{"image":"vaultrun-e2e/does-not-exist:nope"}'

      - name: Per-key secret allowlist
        run: |
          MASTER=$(grep '^MASTER_API_KEY=' .env | cut -d= -f2-)
          api() { curl -sS "$@" -H 'Content-Type: application/json'; }
          LIMITED=$(api -X POST http://localhost:8080/api/v1/keys -H "X-API-Key: $MASTER" \
            -d '{"name":"e2e-limited","allowed_secrets":["NOT_E2E_TOKEN"]}')
          LKEY=$(echo "$LIMITED" | jq -er '.key'); echo "::add-mask::$LKEY"
          LID=$(echo "$LIMITED" | jq -er '.id')
          LSESSION=$(api -X POST http://localhost:8080/api/v1/sessions -H "X-API-Key: $LKEY" \
            -d '{"image":"python:3.12-slim"}' | jq -er '.id')
          run_secret() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/api/v1/sessions/$LSESSION/run" \
              -H "X-API-Key: $LKEY" -H 'Content-Type: application/json' \
              -d '{"command":"echo","args":["x"],"secrets":["E2E_TOKEN"]}'
          }
          [ "$(run_secret)" = "403" ]
          api -X PUT "http://localhost:8080/api/v1/keys/$LID/secrets" -H "X-API-Key: $MASTER" \
            -d '{"allowed_secrets":["E2E_TOKEN"]}' >/dev/null
          [ "$(run_secret)" = "200" ]
          # A non-master key cannot widen its own allowlist.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "http://localhost:8080/api/v1/keys/$LID/secrets" \
            -H "X-API-Key: $LKEY" -H 'Content-Type: application/json' -d '{"allowed_secrets":null}')" = "403" ]

      - name: Dashboard proxies the API with the user's own key
        run: |
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200" ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:3000/api/v1/sessions?limit=1')" = "401" ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:3000/api/v1/sessions?limit=1' -H "X-API-Key: $API_KEY")" = "200" ]
          # Browsers send Origin on POST; the dashboard origin must be accepted, others not.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/sessions/$SESSION_ID/run" \
            -H 'Origin: http://localhost:3000' -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"echo","args":["x"]}')" = "200" ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/sessions/$SESSION_ID/run" \
            -H 'Origin: http://evil.example' -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"echo","args":["x"]}')" = "403" ]
          # The dashboard holds no credentials of its own.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:3000/api/proxy/api/v1/sessions')" = "404" ]

      - name: Audit log signatures verify after storage
        run: |
          RESP=$(curl -sS "http://localhost:8080/api/v1/audit?session_id=$SESSION_ID&limit=100" -H "X-API-Key: $API_KEY")
          echo "$RESP" | jq -c '.audit_logs[] | {action, sig_valid}'
          [ "$(echo "$RESP" | jq '.audit_logs | length')" -gt 0 ]
          [ "$(echo "$RESP" | jq '[.audit_logs[] | select(.sig_valid != true)] | length')" = "0" ]
          [ "$(echo "$RESP" | jq '[.audit_logs[] | select(.sig_status != "valid")] | length')" = "0" ]
          # The whole log, not one page: signatures, chain links and the signed head.
          INTEGRITY=$(curl -sS "http://localhost:8080/api/v1/audit/integrity?refresh=true" -H "X-API-Key: $API_KEY")
          echo "$INTEGRITY" | jq -c .
          [ "$(echo "$INTEGRITY" | jq -r .status)" = "ok" ]
          [ "$(echo "$INTEGRITY" | jq '.chained_entries')" -gt 0 ]

      - name: Audit filters and cost endpoints
        run: |
          api() { curl -sS -H "X-API-Key: $API_KEY" "http://localhost:8080/api/v1$1"; }
          [ "$(api '/audit?action=session.&limit=200' | jq '[.audit_logs[] | select(.action | startswith("session.") | not)] | length')" = "0" ]
          [ "$(api '/audit?action=session.' | jq '.pagination.total')" -ge 1 ]
          [ "$(api '/audit?to=2000-01-01' | jq '.pagination.total')" = "0" ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "X-API-Key: $API_KEY" 'http://localhost:8080/api/v1/audit?from=yesterday')" = "400" ]
          # An empty period must be arrays, not null (the dashboard reads .length).
          [ "$(api '/costs/breakdown?period=2000-01' | jq -r '.top_sessions | type')" = "array" ]
          [ "$(api '/costs/alerts' | jq -r '.alerts | type')" = "array" ]

      - name: Failed session creations do not count against the quota
        run: |
          # MAX_SESSIONS_PER_ACTOR defaults to 20; each failure used to leave a counted row behind.
          for i in $(seq 1 25); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
              -d '{"image":"vaultrun-e2e/does-not-exist:nope"}')
            [ "$CODE" = "400" ] || { echo "attempt $i: HTTP $CODE" >&2; exit 1; }
          done
          CODE=$(curl -sS -o /tmp/after.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -d '{"image":"python:3.12-slim"}')
          echo "HTTP $CODE: $(cat /tmp/after.json)"
          [ "$CODE" = "201" ]
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$(jq -er '.id' /tmp/after.json)" -H "X-API-Key: $API_KEY"

      - name: API reports its version
        run: |
          WANT=$(tr -d '[:space:]' < internal/version/VERSION)
          [ "$(curl -fsS http://localhost:8080/health | jq -r '.version')" = "$WANT" ]

      - name: Costs are recorded for stopped sessions
        run: |
          # The accrual sweep runs every minute; a stopped session is billed for its remainder.
          RESP=$(curl -fsS -X POST http://localhost:8080/api/v1/sessions -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' -d '{"image":"python:3.12-slim","cpu_limit":1,"memory_limit_mb":256}')
          SID=$(echo "$RESP" | jq -er '.id')
          sleep 5
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$SID" -H "X-API-Key: $API_KEY"
          for i in $(seq 1 30); do
            N=$(curl -fsS "http://localhost:8080/api/v1/sessions/$SID/costs" -H "X-API-Key: $API_KEY" | jq '.metrics | length')
            [ "$N" -ge 1 ] && break
            sleep 5
          done
          curl -fsS "http://localhost:8080/api/v1/sessions/$SID/costs" -H "X-API-Key: $API_KEY" | jq -e '.metrics[0].cpu_core_hours > 0'
          jq -e . <<<"$(curl -fsS 'http://localhost:8080/api/v1/costs/breakdown' -H "X-API-Key: $API_KEY")" >/dev/null

      - name: Network allowlist (allowed_hosts) is enforced
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"image":"python:3.12-slim","network_enabled":true,"allowed_hosts":["example.com"]}')
          CODE=$(echo "$RESP" | tail -n1); BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "201" ]
          NET_SESSION=$(echo "$BODY" | jq -er '.id')
          fetch() {
            curl -sS -X POST "http://localhost:8080/api/v1/sessions/$NET_SESSION/run" \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
              -d "{\"command\":\"python\",\"timeout_seconds\":20,\"args\":[\"-c\",\"import urllib.request as u;print(u.urlopen('$1',timeout=5).status)\"]}"
          }
          ALLOWED=$(fetch http://example.com); echo "$ALLOWED" | jq -c '{status, exit_code, stdout, stderr}'
          [ "$(echo "$ALLOWED" | jq -r '.exit_code')" = "0" ]
          BLOCKED=$(fetch http://1.1.1.1); echo "$BLOCKED" | jq -c '{status, exit_code}'
          [ "$(echo "$BLOCKED" | jq -r '.exit_code')" != "0" ]
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$NET_SESSION" -H "X-API-Key: $API_KEY"
          # Rules are removed again with the session.
          sleep 2
          if docker exec vaultrun-netpolicy iptables -S 2>/dev/null | grep -q -- '-N vr-'; then
            echo 'egress chains were not cleaned up' >&2; exit 1
          fi

      - name: Delete session
        run: |
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$SESSION_ID" \
            -H "X-API-Key: $API_KEY"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deployments/docker-compose.yml --env-file .env ps -a || true
          docker compose -f deployments/docker-compose.yml --env-file .env logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f deployments/docker-compose.yml --env-file .env down -v || true
