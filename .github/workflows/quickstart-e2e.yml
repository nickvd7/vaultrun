name: Quickstart E2E

# Runs the README quickstart exactly as a new user would:
# cp .env.example .env -> make up -> make bootstrap-key -> create session -> run command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^MASTER_API_KEY=.*/MASTER_API_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" .env
          sed -i "s/^AUDIT_HMAC_KEY=.*/AUDIT_HMAC_KEY=$(openssl rand -hex 32)/" .env
          echo "VAULTRUN_SECRET_E2E_TOKEN=e2e-secret-value" >> .env

      - name: make up
        run: make up

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "API healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: make bootstrap-key
        run: |
          KEY=$(make -s bootstrap-key | jq -er '.key')
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Create session
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"image":"python:3.12-slim"}')
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "201" ] || { echo "session creation failed" >&2; exit 1; }
          echo "SESSION_ID=$(echo "$BODY" | jq -er '.id')" >> "$GITHUB_ENV"

      - name: Run a command in the sandbox
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"python","args":["-c","print(\"hello from sandbox\")"]}')
          echo "$RESP"
          [ "$(echo "$RESP" | jq -r '.exit_code')" = "0" ]
          echo "$RESP" | jq -er '.stdout' | grep -q "hello from sandbox"

      - name: Secrets broker injects VAULTRUN_SECRET_* from .env
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"sh","args":["-c","printf %s \"$E2E_TOKEN\" | wc -c"],"secrets":["E2E_TOKEN"]}')
          echo "$RESP" | jq -r '.exit_code, .stderr'
          [ "$(echo "$RESP" | jq -r '.exit_code')" = "0" ]
          [ "$(echo "$RESP" | jq -r '.stdout' | tr -d '[:space:]')" = "16" ]

      - name: Injected secrets are redacted from output
        run: |
          RESP=$(curl -sS -X POST "http://localhost:8080/api/v1/sessions/$SESSION_ID/run" \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"command":"sh","args":["-c","echo token=$E2E_TOKEN"],"secrets":["E2E_TOKEN"]}')
          echo "$RESP" | jq -r '.stdout'
          [ "$(echo "$RESP" | jq -r '.stdout')" = "token=[REDACTED:E2E_TOKEN]" ]
          RUN_ID=$(echo "$RESP" | jq -r '.id')
          STORED=$(curl -sS "http://localhost:8080/api/v1/runs/$RUN_ID" -H "X-API-Key: $API_KEY" | jq -r '.stdout')
          if echo "$STORED" | grep -q "e2e-secret-value"; then
            echo "secret value found in stored output" >&2; exit 1
          fi

      - name: Invalid session requests return 400
        run: |
          expect400() {
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -d "$1")
            echo "$1 -> HTTP $CODE"
            [ "$CODE" = "400" ]
          }
          expect400 '{"cpu_limit":-1}'
          expect400 '{"memory_limit_mb":-1}'
          expect400 '{"image":"vaultrun-e2e/does-not-exist:nope"}'

      - name: Audit log signatures verify after storage
        run: |
          RESP=$(curl -sS "http://localhost:8080/api/v1/audit?session_id=$SESSION_ID&limit=100" -H "X-API-Key: $API_KEY")
          echo "$RESP" | jq -c '.audit_logs[] | {action, sig_valid}'
          [ "$(echo "$RESP" | jq '.audit_logs | length')" -gt 0 ]
          [ "$(echo "$RESP" | jq '[.audit_logs[] | select(.sig_valid != true)] | length')" = "0" ]

      - name: Network allowlist (allowed_hosts) is enforced
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' -X POST http://localhost:8080/api/v1/sessions \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"image":"python:3.12-slim","network_enabled":true,"allowed_hosts":["example.com"]}')
          CODE=$(echo "$RESP" | tail -n1); BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "201" ]
          NET_SESSION=$(echo "$BODY" | jq -er '.id')
          fetch() {
            curl -sS -X POST "http://localhost:8080/api/v1/sessions/$NET_SESSION/run" \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
              -d "{\"command\":\"python\",\"timeout_seconds\":20,\"args\":[\"-c\",\"import urllib.request as u;print(u.urlopen('$1',timeout=5).status)\"]}"
          }
          ALLOWED=$(fetch http://example.com); echo "$ALLOWED" | jq -c '{status, exit_code, stdout, stderr}'
          [ "$(echo "$ALLOWED" | jq -r '.exit_code')" = "0" ]
          BLOCKED=$(fetch http://1.1.1.1); echo "$BLOCKED" | jq -c '{status, exit_code}'
          [ "$(echo "$BLOCKED" | jq -r '.exit_code')" != "0" ]
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$NET_SESSION" -H "X-API-Key: $API_KEY"
          # Rules are removed again with the session.
          sleep 2
          if docker exec vaultrun-netpolicy iptables -S 2>/dev/null | grep -q -- '-N vr-'; then
            echo 'egress chains were not cleaned up' >&2; exit 1
          fi

      - name: Delete session
        run: |
          curl -fsS -X DELETE "http://localhost:8080/api/v1/sessions/$SESSION_ID" \
            -H "X-API-Key: $API_KEY"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deployments/docker-compose.yml --env-file .env ps -a || true
          docker compose -f deployments/docker-compose.yml --env-file .env logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f deployments/docker-compose.yml --env-file .env down -v || true
