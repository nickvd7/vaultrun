name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-s -w" ./cmd/api ./cmd/cli ./cmd/ci-runner ./sdk/mcp/

      - name: Cross-build release targets
        run: |
          for t in windows/amd64 darwin/arm64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./sdk/mcp/
          done

      - name: Unit tests
        run: go test ./internal/... ./cmd/api/middleware/... ./cmd/ci-runner/... ./sdk/go/... ./sdk/mcp/... -race -timeout 120s

  integration:
    name: Handler integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultrun_test
          POSTGRES_USER: vaultrun
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: go test -tags integration ./cmd/api/handlers/ -race -timeout 120s
        env:
          INTEGRATION_DSN: postgres://vaultrun:testpassword@localhost:5432/vaultrun_test?sslmode=disable

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultrun_e2e
          POSTGRES_USER: vaultrun
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cache python:3.12-slim as a tarball so Docker Hub is only hit on the
      # first run (or after manual cache busting). Docker Hub enforces a
      # 100-pull/6 h rate limit for unauthenticated runners, which is the
      # primary cause of intermittent e2e failures when the cache is cold.
      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-python-3.12-slim

      - name: Load cached sandbox image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/.docker-cache/python-3.12-slim.tar

      - name: Pull sandbox image (cache miss)
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          # Retry up to 3 times with exponential backoff to handle transient
          # Docker Hub errors or rate-limit responses.
          for attempt in 1 2 3; do
            docker pull python:3.12-slim && break
            if [ "$attempt" -eq 3 ]; then
              echo "All pull attempts failed"
              exit 1
            fi
            echo "Pull attempt $attempt failed; retrying in $((attempt * 10))s…"
            sleep $((attempt * 10))
          done

      - name: Save sandbox image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/.docker-cache
          docker save python:3.12-slim -o /tmp/.docker-cache/python-3.12-slim.tar

      - name: E2E smoke test
        run: go test -tags e2e ./cmd/api/ -v -timeout 300s
        env:
          INTEGRATION_DSN: postgres://vaultrun:testpassword@localhost:5432/vaultrun_e2e?sslmode=disable

      - name: Build browser image
        run: docker build -f docker/browser-playwright-python.Dockerfile -t vaultrun/browser:playwright-python .

      # allowed_hosts needs iptables, so the test binary runs as root; it is
      # built as the runner user so the Go cache stays theirs.
      - name: Network allowlist and browser tests (runc)
        run: |
          set -o pipefail
          go test -c -tags e2e -o "$RUNNER_TEMP/docker.test" ./internal/docker/
          sudo -E "$RUNNER_TEMP/docker.test" -test.run 'TestEgressAllowlistE2E|TestBrowserImageE2E' -test.v -test.timeout 300s | tee out.txt
          # A skip (no internet, missing image) must not pass for coverage.
          grep -q -- '--- PASS: TestEgressAllowlistE2E' out.txt && grep -q -- '--- PASS: TestBrowserImageE2E' out.txt
        env:
          VAULTRUN_TEST_BROWSER_IMAGE: vaultrun/browser:playwright-python

      # DOCKER_RUNTIME=runsc: the same flow with every sandbox under gVisor.
      - name: Install gVisor (runsc)
        run: |
          # Pinned release; releases ship one tarball (runsc + gvisor-bin/).
          URL=https://storage.googleapis.com/gvisor/releases/release/20261019.0/$(uname -m)
          curl -fsSLO "$URL/gvisor.tar.bz2" && curl -fsSLO "$URL/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          # reload, not restart: runtimes are reloadable and the Postgres service container keeps running
          sudo systemctl reload docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc

      - name: Sandbox runtime tests (gVisor)
        run: go test -tags e2e ./internal/docker/ ./internal/warmpool/ -run Runtime -v -timeout 300s
        env:
          VAULTRUN_TEST_RUNTIME: runsc

      - name: Network allowlist and browser tests (gVisor)
        run: |
          set -o pipefail
          sudo -E "$RUNNER_TEMP/docker.test" -test.run 'TestEgressAllowlistE2E|TestBrowserImageE2E' -test.v -test.timeout 300s | tee out.txt
          grep -q -- '--- PASS: TestEgressAllowlistE2E' out.txt && grep -q -- '--- PASS: TestBrowserImageE2E' out.txt
        env:
          VAULTRUN_TEST_RUNTIME: runsc
          VAULTRUN_TEST_BROWSER_IMAGE: vaultrun/browser:playwright-python

      - name: E2E smoke test (gVisor)
        run: |
          PGPASSWORD=testpassword psql -h localhost -U vaultrun -d vaultrun_e2e -c 'CREATE DATABASE vaultrun_e2e_gvisor'
          go test -tags e2e ./cmd/api/ -v -timeout 300s
        env:
          DOCKER_RUNTIME: runsc
          INTEGRATION_DSN: postgres://vaultrun:testpassword@localhost:5432/vaultrun_e2e_gvisor?sslmode=disable

  python-sdk:
    name: Python SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest tests/ -v

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Release versions agree
        working-directory: .
        run: ./scripts/check-versions.sh

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
