# Required environment variables (set in .env before running):
#   MASTER_API_KEY  — bootstrap key for creating the first API key
#   POSTGRES_PASSWORD — database password
#
# See .env.example for all available options.

services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    # Docker socket access for the non-root API user. The GID differs per distro
    # (Ubuntu 999, Debian 102, ...). `make up` detects it and writes it to .env.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID must be set - run `make up` or scripts/detect-docker-gid.sh --write}"
    # Everything in .env reaches the API, so settings that are not listed below
    # (SECRETS_PROVIDER, VAULT_*, AWS_*, VAULTRUN_SECRET_*, SSO, ...) are not
    # silently ignored. Entries in `environment:` take precedence over .env.
    env_file:
      - ../.env
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://vaultrun:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/vaultrun?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      # The workspace directory is bind-mounted at the SAME path on the host and
      # in this container. The API hands that path to the Docker daemon when it
      # mounts a workspace into a sandbox, and the daemon resolves it on the host.
      - WORKSPACE_BASE_DIR=${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}
      - DOCKER_HOST_WORKSPACE_BASE_DIR=${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}
      - MIGRATIONS_PATH=/app/migrations
      - MASTER_API_KEY=${MASTER_API_KEY:?MASTER_API_KEY must be set}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_CONTAINER_PREFIX=vaultrun
      - MAX_FILE_MB=${MAX_FILE_MB:-100}
      - MAX_OUTPUT_MB=${MAX_OUTPUT_MB:-10}
      - GIN_MODE=${GIN_MODE:-release}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Async workers
      - ASYNC_WORKERS=${ASYNC_WORKERS:-4}
      - ASYNC_QUEUE_SIZE=${ASYNC_QUEUE_SIZE:-256}
      # Rate limiting
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-120}
      - ACTOR_RATE_LIMIT_PER_MIN=${ACTOR_RATE_LIMIT_PER_MIN:-0}
      # Session resource limits
      - MAX_SESSION_CPU=${MAX_SESSION_CPU:-8}
      - MAX_SESSION_MEMORY_MB=${MAX_SESSION_MEMORY_MB:-8192}
      - MAX_SESSION_TIMEOUT_SEC=${MAX_SESSION_TIMEOUT_SEC:-86400}
      - MAX_SESSIONS_PER_ACTOR=${MAX_SESSIONS_PER_ACTOR:-20}
      - MAX_WORKSPACE_MB=${MAX_WORKSPACE_MB:-0}
      # Docker sandbox
      - DOCKER_DEFAULT_IMAGE=${DOCKER_DEFAULT_IMAGE:-python:3.12-slim}
      - DOCKER_IDLE_TIMEOUT_MINS=${DOCKER_IDLE_TIMEOUT_MINS:-30}
      # Redis auth
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      # Observability
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-90}
      - STOP_CONTAINERS_ON_SHUTDOWN=${STOP_CONTAINERS_ON_SHUTDOWN:-false}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Auth / policy
      - OPA_POLICY_FILE=${OPA_POLICY_FILE:-}
      # TLS — static files OR ACME (ACME_DOMAIN takes precedence)
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      - ACME_DOMAIN=${ACME_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_CACHE_DIR=${ACME_CACHE_DIR:-/data/acme-cache}
      - DOCKER_IMAGE_ALLOWLIST=${DOCKER_IMAGE_ALLOWLIST:-}
      # Seccomp + cosign (optional but recommended in production)
      - DOCKER_SECCOMP_PROFILE=${DOCKER_SECCOMP_PROFILE:-}
      - COSIGN_PUBLIC_KEY=${COSIGN_PUBLIC_KEY:-}
      # Database TLS (set to require or verify-full in production)
      - DB_SSL_MODE=${DB_SSL_MODE:-}
      - DB_SSL_ROOT_CERT=${DB_SSL_ROOT_CERT:-}
      - DB_SSL_CERT=${DB_SSL_CERT:-}
      - DB_SSL_KEY=${DB_SSL_KEY:-}
    # NET_ADMIN is required for host-side iptables egress filtering when
    # AllowedHosts is set on sessions. Remove if you don't use AllowedHosts.
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}:${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}
      - acme_cache:/data/acme-cache
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot root container: creates the host workspace directory and hands it to
  # the API's non-root user (uid 65532). Docker would otherwise create it as root.
  workspace-init:
    image: alpine:3.21
    user: "0:0"
    command: >
      sh -c 'mkdir -p "$$WS" && chown 65532:65532 "$$WS" && chmod 700 "$$WS"'
    environment:
      - WS=${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}
    volumes:
      - ${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}:${WORKSPACE_HOST_DIR:-/var/lib/vaultrun/workspaces}
    restart: "no"

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Server-side proxy env vars (not exposed to browser bundle)
      - VAULTRUN_API_URL=${VAULTRUN_API_URL:-http://api:8080}
      - VAULTRUN_API_KEY=${MASTER_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=vaultrun
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=vaultrun
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  acme_cache:
